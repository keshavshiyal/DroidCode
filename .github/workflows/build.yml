name: Build Android APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Create Google Services Config if Missing
        run: |
          if [ ! -f ./app/google-services.json ]; then
            echo '{
              "project_info": {
                "project_number": "1234567890",
                "project_id": "droidcode-app",
                "storage_bucket": "droidcode-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                    "android_client_info": {
                      "package_name": "com.aistudio.droidcode.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "AIzaSyDummyKeyForBuildOnly"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > ./app/google-services.json
          fi

      - name: Gracefully Setup Signing Keystore
        run: |
          # Priority 1: Restore from repository debug.keystore.base64 if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Priority 2: Restore release keystore if RELEASE_KEYSTORE_BASE64 secret is provided
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          fi

          # Priority 3: Fallback generate debug.keystore if still missing
          if [ ! -f ./debug.keystore ]; then
            echo "Generating new debug keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          if [ -s ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Locate Built APK Files
        run: |
          echo "Scanning for generated APKs..."
          mkdir -p app/build/outputs/apk/
          find app/build/outputs/apk/ -type f -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidCode-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
