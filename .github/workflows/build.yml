name: Build Android APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Generating fallback debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Android Lint (Static Analysis)
        run: |
          echo "Running Android Lint with warnings as errors..."
          if [ -s ./gradlew ]; then
            ./gradlew lintDebug -Dlint.abortOnError=true -Dlint.warningsAsErrors=true --stacktrace 2>&1 | tee gradle_output.txt || {
              echo "=== LINT FAILURE REPORT ==="
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-lint-report
              git add -f gradle_output.txt 2>/dev/null || true
              find app/build/reports -type f -exec git add -f {} + 2>/dev/null || true
              git commit -m "ci: lint failure log [skip ci]" || true
              git push origin ci-lint-report --force || true
              exit 1
            }
          else
            gradle lintDebug -Dlint.abortOnError=true -Dlint.warningsAsErrors=true --stacktrace 2>&1 | tee gradle_output.txt || {
              echo "=== LINT FAILURE REPORT ==="
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-lint-report
              git add -f gradle_output.txt 2>/dev/null || true
              find app/build/reports -type f -exec git add -f {} + 2>/dev/null || true
              git commit -m "ci: lint failure log [skip ci]" || true
              git push origin ci-lint-report --force || true
              exit 1
            }
          fi

      - name: Upload Lint Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*

      - name: Run Detekt Static Analysis
        run: |
          echo "Running Detekt static analysis..."
          curl -sSLO https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6.zip
          unzip -q detekt-cli-1.23.6.zip
          ./detekt-cli-1.23.6/bin/detekt-cli --config detekt.yml --input app/src/main/java

      - name: Run Unit Tests
        run: |
          if [ -s ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test_output.txt || {
              echo "=== UNIT TEST FAILURE REPORT ==="
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-test-failure
              git add -f test_output.txt 2>/dev/null || true
              find app/build/reports/tests -type f -exec git add -f {} + 2>/dev/null || true
              git commit -m "ci: test failure log [skip ci]" || true
              git push origin ci-test-failure --force || true
              exit 1
            }
          else
            gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee test_output.txt || {
              echo "=== UNIT TEST FAILURE REPORT ==="
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-test-failure
              git add -f test_output.txt 2>/dev/null || true
              find app/build/reports/tests -type f -exec git add -f {} + 2>/dev/null || true
              git commit -m "ci: test failure log [skip ci]" || true
              git push origin ci-test-failure --force || true
              exit 1
            }
          fi

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/**

      - name: Build Debug APK
        run: |
          if [ -s ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -s ./gradlew ]; then
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCode-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DroidCode-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
