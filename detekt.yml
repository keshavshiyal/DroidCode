build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1
    comments: 1

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 120
  LargeClass:
    active: true
    threshold: 600
  ComplexCondition:
    active: true
    threshold: 4

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)' # Supports Composable functions
  TopLevelPropertyNaming:
    active: true

style:
  active: true
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  MagicNumber:
    active: false

potential-bugs:
  active: true
  UnreachableCode:
    active: true
