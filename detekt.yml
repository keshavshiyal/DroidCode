build:
  maxIssues: 0

complexity:
  active: true
  LongMethod:
    active: false
  LargeClass:
    active: false
  ComplexCondition:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)' # Supports Composable functions
  TopLevelPropertyNaming:
    active: true

style:
  active: true
  WildcardImport:
    active: false
  UnusedImports:
    active: false
  MagicNumber:
    active: false

potential-bugs:
  active: true
  UnreachableCode:
    active: true
